type: drupal11
docroot: web
webserver_type: apache-fpm
database:
  type: mariadb
  version: "11.8"
mutagen_enabled: false
use_dns_when_possible: true
composer_version: "2"
corepack_enable: true
web_environment:
  - "STORYBOOK_SERVER_RENDER_URL=https://${DDEV_PROJECT}.${DDEV_TLD}/storybook/stories/render"
  - "DDEV_PRIMARY_URL=https://${DDEV_PROJECT}.${DDEV_TLD}"
nodejs_version: "20"
dbimage_extra_packages: [sudo]
webimage_extra_packages:
  - php${DDEV_PHP_VERSION}-yaml
  - xdg-utils
  - pkg-config
  - libpixman-1-dev
  - libcairo2-dev
  - libpango1.0-dev
  - make
web_extra_exposed_ports:
  - name: storybook
    container_port: 6006
    http_port: 6007
    https_port: 6006
web_extra_daemons:
  - name: node.js
    command: "tail -F package.json > /dev/null"
    directory: /var/www/html
hooks:
  post-start:
    - exec: yarn set version berry
    # Write .env.storybook with correct Drupal URLs for Storybook.
    # Port is included only when non-default (not 443):
    #   DDEV only (port 443):       https://myproject.ddev.site
    #   Local LAMP + DDEV (8443):   https://myproject.ddev.site:8443
    - exec: >-
        bash -c '
          PORT="${DDEV_ROUTER_HTTPS_PORT:-443}";
          BASE="${DDEV_PRIMARY_URL_WITHOUT_PORT}";
          if [ "$PORT" = "443" ]; then
            URL="${BASE}";
          else
            URL="${BASE}:${PORT}";
          fi;
          echo "STORYBOOK_SERVER_URL=${URL}" > /var/www/html/.env.storybook;
          echo "STORYBOOK_SERVER_RENDER_URL=${URL}/storybook/stories/render" >> /var/www/html/.env.storybook;
          echo "Storybook URLs written to .env.storybook:";
          cat /var/www/html/.env.storybook;
        '
