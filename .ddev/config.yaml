type: drupal11
docroot: docroot
webserver_type: apache-fpm
database:
  type: mariadb
  version: "10.11"
mutagen_enabled: false
use_dns_when_possible: true
composer_version: "2"
web_environment: []
php_version: "8.3"
nodejs_version: "20"
dbimage_extra_packages: [sudo]
webimage_extra_packages:
  - "php${DDEV_PHP_VERSION}-yaml"
  - xdg-utils
  - pkg-config
  - libpixman-1-dev
  - libcairo2-dev
  - libpango1.0-dev
  - make
web_extra_exposed_ports:
  - name: storybook
    container_port: 6006
    http_port: 6007
    https_port: 6006
web_extra_daemons:
  - name: node.js
    command: "tail -F package.json > /dev/null"
    directory: /var/www/html
