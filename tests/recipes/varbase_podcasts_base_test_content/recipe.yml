name: 'Varbase Podcasts Base Test Content'
description: 'Testing-only content for the Varbase Podcasts Base functional testing suite. Creates three published example podcasts and 15 published example podcast episodes, 10 in the first podcast and 5 in the second (the third, the authoring podcast, starts empty and takes the episodes the authoring scenarios create), that share one tag and one cover-art media item: 12 episodes reference one uploaded Audio media item and 3 have no audio at all, so the show, listing, result-summary, exposed-filter, pager, related-episodes and audio scenarios have deterministic data to assert against. Also adds the /podcasts and /podcast-episodes listing pages as Canvas pages. Applied only by the test pipeline, not for production sites.'
type: 'Content'
