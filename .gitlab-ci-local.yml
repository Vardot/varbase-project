# Slim pipeline for `gitlab-ci-local` (https://github.com/firecow/gitlab-ci-local).
#
# The real .gitlab-ci.yml `include:`s the drupalci templates and runs the
# varbase-e2e browser job inside the drupalci PHP-Apache image with a MySQL
# service after a full `drush site:install varbase` - none of which
# gitlab-ci-local can reproduce ($_GITLAB_TEMPLATES_REPO is not a public path,
# and the browser job needs the composer-built Varbase site artifact).
#
# This file mirrors the jobs that ARE reproducible locally: the validate-stage
# linters on Node 20 (varbase-e2e >=2.0 declares engines.node ">=20").
#
# Usage:
#   npx gitlab-ci-local --file .gitlab-ci-local.yml            # all jobs
#   npx gitlab-ci-local --file .gitlab-ci-local.yml eslint     # one job
#
# The full browser suite runs against a live site instead:
#   LAUNCH_URL=https://my-site.ddev.site yarn test:chromium

stages:
  - validate

variables:
  # Drupal 11.4.0 released 2026-07-01; pinned templates ref $CORE_STABLE is still 11.3.
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# The lint jobs install with `yarn install --mode=skip-build`: the package.json
# `postinstall` runs recipes/varbase_starter/scripts/drupal-libraries-sync.js,
# which only exists after a composer build. The lint jobs have no composer
# build, and eslint/stylelint do not need the Drupal libraries sync.

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: false

eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  allow_failure: false

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - yarn lint:css || true
  allow_failure: false
