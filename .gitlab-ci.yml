################################################################################
# GitLab CI for the Varbase project template.
#
# Self-contained validation jobs (cspell / eslint / stylelint / PHPCS / PHPStan)
# plus an automated-functional-testing browser job that builds Varbase, installs
# it with the `varbase` profile, applies the base + AI recipes, seeds the
# per-role testing users and drives the whole site through the browser.
#
# drupalci's own composer-artifact jobs are disabled below: a full Varbase build
# is too large to publish as an artifact (413), so each job builds in-job.
################################################################################

include:
  - local: '.gitlab-ci/php.yml'
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

# Pipeline stages. `build` / `validate` keep the drupalci jobs; the Varbase
# browser flow runs as pre-test (install) -> test (run suite) -> post-test
# (build reports).
stages:
  - build
  - validate
  - pre-test
  - test
  - post-test

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: 1
  # Yarn 4 defaults to immutable installs and would refuse to create a
  # lockfile in CI; allow it for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Self-contained PHPCS / PHPStan jobs (scan the project's own recipe code).
  _VARBASE_PHPCS_PATHS: "recipes/varbase_starter"
  _PHPSTAN_NEON: "phpstan.neon"
  _PHPSTAN_BASELINE: ".phpstan-baseline.php"
  # Cache locations (Composer packages, Yarn packages, Playwright browsers) so
  # the build / install / test jobs reuse downloads instead of re-fetching.
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/composer"
  YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/.cache/yarn"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"

# Shared cache definition referenced by the build / install / test jobs.
.varbase_cache: &varbase_cache
  key: "varbase-build"
  paths:
    - .cache/composer
    - .cache/yarn
    - .cache/ms-playwright

# Override composer job to build straight from this project's composer.json.
#
# drupalci's default composer job resolves against its own pinned package set
# and only sees cweagans/composer-patches 1.7.3, which fails the project's
# `~2.0` constraint. Clearing the cache and running a fresh `composer update`
# against this composer.json resolves the documented set (composer-patches
# 2.0.0 is a stable release) so the build matches composer.json exactly.
composer:
  cache: *varbase_cache
  before_script:
    - composer self-update
  script:
    - composer validate --no-check-all --no-check-publish
    # --prefer-dist pulls dist archives instead of cloning full .git histories.
    # Dev packages (drupal/varbase, drupal/webshare, …) cloned as source carry
    # large .git histories that blow the build artifact past the GitLab
    # artifact-size limit (413 Request Entity Too Large). dist keeps the
    # artifact small without changing the installed code.
    - composer update --with-all-dependencies --no-interaction --no-progress --optimize-autoloader --prefer-dist
  # A full Varbase build (web/ + vendor/) exceeds the GitLab artifact-size
  # limit (413 Request Entity Too Large), so do NOT pass the build downstream.
  # Publish only the resolved lock file; jobs that need the codebase run their
  # own `composer install --prefer-dist` from this lock (see the functional job).
  artifacts:
    expire_in: 1 day
    paths:
      - composer.json
      - composer.lock

# = Disable drupalci jobs that depend on the full composer build artifact =
#
# A full Varbase build is too large to publish as an artifact (413), so the
# composer job only passes composer.lock and the browser job rebuilds in-job.
# drupalci's PHP jobs (phplint / phpcs / phpstan / phpunit / nightwatch) instead
# expect the whole vendor/ + the composer status marker in the artifact, so they
# fail here. Turn them off; the self-contained jobs below cover validation.
# (`script` is overridden too so these stay valid even if a name is absent.)
composer-lint:
  rules: [{ when: never }]
  script: ["true"]
phpcs:
  rules: [{ when: never }]
  script: ["true"]
phpstan:
  rules: [{ when: never }]
  script: ["true"]
phpunit:
  rules: [{ when: never }]
  script: ["true"]
nightwatch:
  rules: [{ when: never }]
  script: ["true"]
"upgrade status":
  rules: [{ when: never }]
  script: ["true"]
"deprecation - composer":
  rules: [{ when: never }]
  script: ["true"]

# = Validate stage =

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: false

# Node 20+ required: webship-js >= 2.0 declares engines.node ">=20".
eslint:
  stage: validate
  image: node:20
  # --mode=skip-build skips the package.json postinstall (drupal-libraries-sync,
  # which needs a composer build); linting only needs the JS dev dependencies.
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: false

# = Self-contained PHP analysis =
#
# These run their own `composer require --dev` (a full in-job install, needs: [])
# so they do NOT depend on the composer build artifact - which a full Varbase
# distribution is too large to publish (413). They replace drupalci's phpcs /
# phpstan jobs (disabled above), scanning only the project's own recipe code.

# PHP Coding Standards (PHPCS) - Drupal/DrupalPractice
'🧹 PHP Coding standards (PHPCS)':
  stage: validate
  needs: []
  variables:
    _ARTIFACTS_DIR: "test-artifacts/phpcs"
  before_script:
    - composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer require --dev drupal/coder micheh/phpcs-gitlab --no-interaction
    - mkdir -p $_ARTIFACTS_DIR
  script:
    - echo "Scanning Varbase profile and recipes..."
    - |
      vendor/bin/phpcs --version
      vendor/bin/phpcs --standard=Drupal,DrupalPractice \
        --extensions=php,module,inc,install,test,profile,theme \
        --ignore=*/node_modules/*,*/vendor/* \
        --report=full --report-summary \
        --report-\\Micheh\\PhpCodeSniffer\\Report\\Gitlab=$_ARTIFACTS_DIR/phpcs-quality-report.json \
        $_VARBASE_PHPCS_PATHS || EXIT_CODE=$?
      if [ -n "$EXIT_CODE" ]; then
        echo "PHPCS found issues (exit code: $EXIT_CODE)"
        exit $EXIT_CODE
      fi
  artifacts:
    when: always
    reports:
      codequality: $_ARTIFACTS_DIR/phpcs-quality-report.json
    paths:
      - $_ARTIFACTS_DIR
    expire_in: 1 week
  allow_failure: false

# PHPStan Static Analysis
'🧹 PHP Static Analysis (PHPStan)':
  stage: validate
  needs: []
  variables:
    _ARTIFACTS_DIR: "test-artifacts/phpstan"
  before_script:
    - composer config --no-plugins allow-plugins.phpstan/extension-installer true
    - composer require --dev phpstan/phpstan mglaman/phpstan-drupal phpstan/extension-installer --no-interaction
    - mkdir -p $_ARTIFACTS_DIR
  script:
    - echo "Running PHPStan on Varbase profile and recipes..."
    - |
      vendor/bin/phpstan --version
      vendor/bin/phpstan analyse --configuration=$_PHPSTAN_NEON --memory-limit=2G \
        --error-format=gitlab > $_ARTIFACTS_DIR/phpstan-quality-report.json || EXIT_CODE=$?
      # When PHPStan fails, regenerate a baseline file
      if [ -n "$EXIT_CODE" ]; then
        echo "Generating a PHPStan baseline file (available as job artifact)."
        cp $CI_PROJECT_DIR/.gitlab-ci/scripts/.empty-phpstan-baseline.php $_PHPSTAN_BASELINE
        vendor/bin/phpstan analyse --configuration=$_PHPSTAN_NEON --memory-limit=2G --no-progress \
          --generate-baseline=$_PHPSTAN_BASELINE || true
        # Report statistics on the new baseline
        php $CI_PROJECT_DIR/.gitlab-ci/scripts/phpstan-baseline-statistics.php $_PHPSTAN_BASELINE $_ARTIFACTS_DIR/phpstan-metrics.txt
        # Copy the baseline to artifacts
        cp $_PHPSTAN_BASELINE $_ARTIFACTS_DIR/phpstan-baseline.php
        echo "PHPStan found issues (exit code: $EXIT_CODE)"
        exit $EXIT_CODE
      fi
  artifacts:
    when: always
    reports:
      codequality: $_ARTIFACTS_DIR/phpstan-quality-report.json
      metrics: $_ARTIFACTS_DIR/phpstan-metrics.txt
    paths:
      - $_ARTIFACTS_DIR
    expire_in: 1 week
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  # Build the codebase in-job from the composer artifact's lock file (the
  # composer job does not pass the full build - too large to artifact) and
  # install ImageMagick (Varbase's image toolkit; the drupalci image lacks the
  # identify/convert binaries -> error 127).
  prepare_code: &prepare_code
    - apt-get update -y && apt-get install -y imagemagick
    # The cached Composer VCS clones are owned by a different uid across jobs;
    # tell git to trust them (otherwise "detected dubious ownership").
    - git config --global --add safe.directory '*'
    - composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  # Import the installed-site DB dump produced by the previous pre-test job.
  restore_db: &restore_db
    - gunzip -c $CI_PROJECT_DIR/varbase-db.sql.gz | $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:cli
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
  # Rebuild caches and dump the DB for the next pre-test job in the chain.
  dump_db: &dump_db
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:dump --gzip --result-file=$CI_PROJECT_DIR/varbase-db.sql
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    # Full install runs the package.json postinstall (drupal-libraries-sync),
    # syncing the front-end libraries into web/libraries - the recipes are
    # present here from the composer artifact (CircleCI parity).
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = Varbase install - own job =
#
# Builds the codebase, installs Varbase with the `varbase` profile, applies the
# base + AI recipes, seeds the per-role testing users and prepares the site for
# deterministic testing (mirrors ddev init-full-automated-testing). It then
# exports the installed site as small artifacts (a gzipped DB dump + settings.php
# + the files directory) so the browser-test job can restore it without
# re-running the lengthy install - keeping each job under the runner timeout.
# Shared template for every pre-test step. Each step rebuilds the code, restores
# the previous step's DB dump, runs its own `script`, then dumps the DB again for
# the next step (the chain is wired with `needs`). The installed site travels
# between jobs as small artifacts (gzipped DB dump + settings.php + files).
.site-step:
  extends: .testing-job-base
  stage: pre-test
  timeout: 2h
  cache: *varbase_cache
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - varbase-db.sql.gz
      - $_WEB_ROOT/sites/default/settings.php
      - $_WEB_ROOT/sites/default/files
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
    - !reference [.fragments, restore_db]
  allow_failure: false

# pre-test step 1: fresh Varbase install (no DB to restore).
"📦 Install Varbase":
  extends: .site-step
  needs: [composer]
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install varbase
        --db-url=$SIMPLETEST_DB
        --account-name=webmaster --account-pass=dD.123123ddd --account-mail=webmaster@vardot.com
        --site-name="Varbase Test" --locale=en -y
    - !reference [.fragments, dump_db]

# pre-test steps 2..N: one recipe per job, chained via `needs`.
"🧩 Recipe: Users base":
  extends: .site-step
  needs: ["📦 Install Varbase"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_users_base -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: Dev base":
  extends: .site-step
  needs: ["🧩 Recipe: Users base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_dev_base -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: i18n base":
  extends: .site-step
  needs: ["🧩 Recipe: Dev base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_i18n_base -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: API base":
  extends: .site-step
  needs: ["🧩 Recipe: i18n base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_api_base -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: Auth base":
  extends: .site-step
  needs: ["🧩 Recipe: API base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_auth_base -y || true
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:enable social_auth_facebook social_auth_linkedin -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI base":
  extends: .site-step
  needs: ["🧩 Recipe: Auth base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_base -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI editor assistant":
  extends: .site-step
  needs: ["🧩 Recipe: AI base"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_editor_assistant -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI image alt":
  extends: .site-step
  needs: ["🧩 Recipe: AI editor assistant"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_image_alt -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI taxonomy tagging":
  extends: .site-step
  needs: ["🧩 Recipe: AI image alt"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_taxonomy_tagging -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI context":
  extends: .site-step
  needs: ["🧩 Recipe: AI taxonomy tagging"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_context -y || true
    - !reference [.fragments, dump_db]

"🧩 Recipe: AI safety":
  extends: .site-step
  needs: ["🧩 Recipe: AI context"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_safety -y || true
    - !reference [.fragments, dump_db]

# pre-test step: seed the per-role testing users (registry mirrors cucumber.js).
"👥 Add testing users":
  extends: .site-step
  needs: ["🧩 Recipe: AI safety"]
  script:
    - cd $CI_PROJECT_DIR/recipes/varbase_starter/scripts && bash add-testing-users.sh && cd $CI_PROJECT_DIR
    - !reference [.fragments, dump_db]

# pre-test final step: deterministic-testing tweaks, then dump for the test job.
"⚙️ Prepare site":
  extends: .site-step
  needs: ["👥 Add testing users"]
  script:
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:uninstall antibot -y || true
    # Raise login flood ceilings so the many test logins are not blocked.
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood ip_limit 1000000 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood user_limit 1000000 -y
    # Drop Honeypot's time trap (rejects scripted form posts) - keep field protection.
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set honeypot.settings time_limit 0 -y || true
    # Disable the floating AI chatbot widget - it intercepts clicks near it.
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '$b=\Drupal::entityTypeManager()->getStorage("block")->load("ai_chatbot"); if($b){$b->disable()->save();}' || true
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance css.preprocess 0 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance js.preprocess 0 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.logging error_level all -y
    - !reference [.fragments, dump_db]

# = webship-js BDD - Varbase profile =
#
# Restores the installed site from the varbase-install artifacts (DB dump +
# settings.php + files), installs Node + Playwright, and drives the whole
# `tests/features/**` suite through the browser. cucumber.js auto-discovers the
# LAUNCH_URL; in CI we pin it to the local Apache.
"🧪 Automated functional testing":
  extends: .testing-job-base
  stage: test
  needs: [composer, "⚙️ Prepare site"]
  timeout: 2h
  cache: *varbase_cache
  # Override the parent's services - we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    WEBSHIP_REPORT_DISABLE: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
    # = Restore the installed site (settings.php + files came via artifacts) =
    - gunzip -c $CI_PROJECT_DIR/varbase-db.sql.gz | $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:cli
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # = Node.js 20 + Playwright Chromium =
    - !reference [.fragments, node_playwright]
  script:
    # Run the suite only - report generation is a separate `create-reports`
    # job. Disable webship-js's auto HTML hook so it does not try to build a
    # report from process.on('exit'); the JSON it leaves behind is the input
    # for create-reports.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  allow_failure: false

# = Create reports - own job =
#
# Turns the cucumber JSON (+ screenshots / videos) from the test job into the
# HTML and PDF reports. Runs on a plain node image with just webship-js + a
# Chromium for the PDF - no Drupal build needed.
"📊 Create reports":
  stage: post-test
  image: node:20
  needs:
    - job: "🧪 Automated functional testing"
      artifacts: true
  cache: *varbase_cache
  before_script:
    - npm install --no-save webship-js
    - ./node_modules/.bin/playwright install chromium
  script:
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  artifacts:
    when: always
    paths:
      - tests/reports/
    expire_in: 7 days
  allow_failure: false
