################################################################################
# GitLab CI for the Varbase 10.1.x project template.
#
# Keeps the drupalci PHPCS / PHPStan / composer-lint validation jobs disabled
# (they need the full composer build artifact, which is too large to publish),
# replaces them with self-contained emoji-named validate jobs (cspell / eslint /
# stylelint / phpcs / phpstan / yaml), and runs a pre-test -> test -> post-test
# browser flow that builds Varbase, installs it with the CLASSIC `varbase`
# profile (Varbase 10.1.x is NOT recipe-based), seeds the per-role testing
# users, prepares the site for deterministic testing, and drives the whole site
# through the browser with varbase-e2e (Playwright + Cucumber-js).
#
# Varbase 10.1.x targets Drupal ~11.3/11.4; DRUPAL_CORE is pinned to 11.4.0 with
# IGNORE_PROJECT_DRUPAL_CORE_VERSION so the drupalci variables match the rest of
# the 10.1.x line.
#
# NOTE vs 11.0.x: there are NO `drush recipe ...` apply steps here (no
# varbase_dev_base / i18n / api / auth / ai / context / safety), and no AI /
# Canvas specific jobs — 10.1.x installs everything through the profile.
################################################################################

include:
  - local: '.gitlab-ci/php.yml'
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

# Pipeline stages. `build` / `validate` keep the (overridden) drupalci jobs; the
# Varbase browser flow runs as pre-test (install) -> test (run suite) ->
# post-test (build reports).
stages:
  - build
  - validate
  - pre-test
  - test
  - post-test

# = Path-based job gating (#3616266) ==========================================
# Skip a job when the files it cares about did not change, but ALWAYS run the
# full pipeline on the default branch, release branches and tags. Job-level
# rules compose with the drupalci workflow: block, they do not override it.
.run_on_release_refs: &run_on_release_refs
  if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: on_success

# A project developer's own code lives in docroot/modules/custom,
# docroot/themes/custom and docroot/recipes/custom (this line scaffolds Drupal
# into docroot/). Those three paths gate (and are the scope of) the PHPCS /
# PHPStan validation below, and are part of the app-changes set that gates the
# heavy install + test chain, so "what triggers a job" matches "what a
# developer edits".
.varbase_app_changes: &varbase_app_changes
  - "composer.json"
  - "composer.lock"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/**/*"
  - "config/**/*"
  - "docroot/modules/custom/**/*"
  - "docroot/themes/custom/**/*"
  - "docroot/recipes/custom/**/*"
  - "tests/**/*"
  - "package.json"
  - "yarn.lock"
  - ".yarnrc.yml"
  - "cucumber.js"
  - "bin/**/*"

variables:
  # This project scaffolds Drupal into docroot/ (see composer.json
  # drupal-scaffold web-root), but the drupalci default _WEB_ROOT is "web".
  # Pin it to docroot so every step (info.yml relax, sites dir, symlink, drush
  # --root, settings.php artifact) targets the real web root. Without this the
  # relax ran on an empty web/ dir and drush (via drupal-finder) installed the
  # un-relaxed docroot modules, failing with "module ... is incompatible".
  _WEB_ROOT: "docroot"
  # Pin Drupal core for the whole 10.1.x line (Drupal ~11.3/11.4).
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  # This line works with PHP 8.4 (locks are generated under 8.4); pin the
  # drupalci job images accordingly (default for core 11.4 is PHP 8.3).
  _TARGET_PHP: "8.4"
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: 1
  # Yarn 4 defaults to immutable installs and would refuse to create a
  # lockfile in CI; allow it for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Cache locations (Composer packages, Yarn packages, Playwright browsers) so
  # the build / install / test jobs reuse downloads instead of re-fetching.
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/composer"
  YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/.cache/yarn"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"

# Shared cache definition referenced by the build / install / test jobs.
# Populated by the Install Varbase job: the download caches PLUS the built
# output trees (vendor, node_modules, the docroot incl. installed files) and the
# ms-playwright browsers. The parallel test jobs pull this (see .test_cache) so
# they skip composer/yarn/playwright entirely and only restore the DB dump (1s).
.varbase_cache: &varbase_cache
  key: "varbase-build-v2-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/composer
    - .cache/yarn
    - .cache/ms-playwright
    - vendor
    - node_modules
    - docroot
    - bin

.test_cache: &test_cache
  key: "varbase-build-v2-$CI_COMMIT_REF_SLUG"
  policy: pull
  paths:
    - .cache/composer
    - .cache/yarn
    - .cache/ms-playwright
    - vendor
    - node_modules
    - docroot
    - bin

# Override composer job to build straight from this project's composer.json.
composer:
  cache: *varbase_cache
  before_script:
    - composer self-update
    - git config --global --add safe.directory '*'
  script:
    - composer validate --no-check-all --no-check-publish
    # --prefer-dist pulls dist archives instead of cloning full .git histories,
    # keeping the build artifact under the GitLab artifact-size limit.
    - composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
  artifacts:
    expire_in: 1 day
    paths:
      - composer.json
      - composer.lock

# = Disable drupalci jobs that need the full composer build artifact =
#
# A full Varbase build is too large to publish as an artifact (413), so the
# composer job only passes composer.lock. drupalci's composer-lint / phpcs /
# phpstan expect the whole vendor/ + the composer status marker, so they cannot
# run here. We provide self-contained emoji-named replacements below.
composer-lint:
  rules: [{ when: never }]
  script: ["true"]
phpcs:
  rules: [{ when: never }]
  script: ["true"]
phpstan:
  rules: [{ when: never }]
  script: ["true"]
phpunit:
  rules: [{ when: never }]
  script: ["true"]
nightwatch:
  rules: [{ when: never }]
  script: ["true"]
"upgrade status":
  rules: [{ when: never }]
  script: ["true"]
"deprecation - composer":
  rules: [{ when: never }]
  script: ["true"]
cspell:
  rules: [{ when: never }]
  script: ["true"]
eslint:
  rules: [{ when: never }]
  script: ["true"]
stylelint:
  rules: [{ when: never }]
  script: ["true"]

# = Validate stage =

"🔤 Cspell":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.php"
        - "**/*.module"
        - "**/*.inc"
        - "**/*.install"
        - "**/*.js"
        - "**/*.css"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.txt"
        - ".cspell.json"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: false

# = YAML lint =
"📐 YAML lint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.yml"
        - "**/*.yaml"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: python:3.12-slim
  needs: []
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python - <<'PY'
      import sys, yaml
      from pathlib import Path

      class Loader(yaml.SafeLoader):
          pass
      Loader.add_multi_constructor('', lambda loader, suffix, node: None)

      SKIP = ('vendor/', 'node_modules/', 'web/core/', 'web/modules/contrib/',
              'web/themes/contrib/', 'web/profiles/contrib/', 'web/libraries/',
              '.cache/')
      errors = 0
      count = 0
      for path in sorted(Path('.').rglob('*.y*ml')):
          rel = str(path).lstrip('./')
          if any(s in rel for s in SKIP):
              continue
          count += 1
          try:
              with open(path) as fh:
                  list(yaml.load_all(fh, Loader=Loader))
          except yaml.YAMLError as e:
              errors += 1
              print(f"INVALID: {rel}\n  {e}")
      print(f"Checked {count} YAML files, {errors} invalid.")
      sys.exit(1 if errors else 0)
      PY
  allow_failure: false

"🟨 ESLint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.js"
        - "**/*.yml"
        - ".eslintrc.json"
        - "package.json"
        - "yarn.lock"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

"🎨 Stylelint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.css"
        - ".stylelintrc.json"
        - "package.json"
        - "yarn.lock"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: false

# = PHP_CodeSniffer (Drupal coding standards) =
"🐘 PHPCS":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "docroot/modules/custom/**/*"
        - "docroot/themes/custom/**/*"
        - "docroot/recipes/custom/**/*"
        - "**/*.php"
        - "**/*.module"
        - "**/*.inc"
        - "**/*.install"
        - "**/*.theme"
        - "**/*.profile"
        - ".phpcs.xml"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: php:8.4-cli
  needs: []
  before_script:
    - apt-get update -y && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer global require drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer --no-interaction
    - export PATH="$(composer global config bin-dir --absolute 2>/dev/null):$PATH"
  script:
    # A project developer's custom code lives in docroot/modules/custom,
    # docroot/themes/custom and docroot/recipes/custom. Create them so PHPCS has
    # valid (possibly empty) targets instead of erroring on a missing path on a
    # fresh template, then sniff all three the same way a developer would locally.
    - mkdir -p docroot/modules/custom docroot/themes/custom docroot/recipes/custom
    - phpcs --version
    - phpcs --standard=.phpcs.xml -p docroot/modules/custom docroot/themes/custom docroot/recipes/custom
  allow_failure: false

# = PHPStan (static analysis) =
"🔬 PHPStan":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "docroot/modules/custom/**/*"
        - "docroot/themes/custom/**/*"
        - "docroot/recipes/custom/**/*"
        - "**/*.php"
        - "**/*.module"
        - "**/*.inc"
        - "**/*.install"
        - "phpstan.neon"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  image: php:8.4-cli
  needs: []
  before_script:
    - apt-get update -y && apt-get install -y curl
    - curl -sSL https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -o phpstan.phar
    - chmod +x phpstan.phar
  script:
    # Analyse a developer's own custom code (docroot/modules/custom,
    # docroot/themes/custom, docroot/recipes/custom) - the same scope they would
    # run locally. Only analyse dirs that actually contain PHP (the template
    # ships none yet); otherwise PHPStan errors with "No files found to analyse".
    - |
      SCOPE=""
      for d in docroot/modules/custom docroot/themes/custom docroot/recipes/custom; do
        if [ -d "$d" ] && find "$d" -name '*.php' | grep -q .; then
          SCOPE="$SCOPE $d"
        fi
      done
      if [ -n "$SCOPE" ]; then
        php phpstan.phar analyse -c phpstan.neon --no-progress $SCOPE
      else
        echo "No PHP files in PHPStan scope (docroot/*/custom) - nothing to analyse."
      fi
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  # Build the codebase in-job from the composer artifact's lock file and install
  # ImageMagick (Varbase's image toolkit) with WebP support.
  prepare_code: &prepare_code
    - apt-get update -y && apt-get install -y imagemagick webp libwebp7
    - apt-get install -y libmagickcore-7.q16-10-extra || apt-get install -y libmagickcore-6.q16-6-extra || true
    - sed -i 's/rights="none"\s*pattern="WEBP"/rights="read|write" pattern="WEBP"/I' /etc/ImageMagick-*/policy.xml 2>/dev/null || true
    - git config --global --add safe.directory '*'
    - chmod -R u+w $CI_PROJECT_DIR/$_WEB_ROOT/sites 2>/dev/null || true
    - composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
    # Apply the temporary on-disk code fixes (info.yml core-req relax, demo
    # oEmbed provider swap, module JS/PHP patches). Documented in the script.
    - bash $CI_PROJECT_DIR/tests/scripts/prepare-code-fixes.sh
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - a2enmod rewrite headers
    - printf '<Directory /var/www/html>\n  Options +FollowSymLinks\n  AllowOverride All\n  Require all granted\n</Directory>\n' > /etc/apache2/conf-available/drupal-docroot.conf
    - a2enconf drupal-docroot
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  # Rebuild caches and dump the DB for the next pre-test job in the chain.
  dump_db: &dump_db
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:dump --gzip --result-file=$CI_PROJECT_DIR/varbase-db.sql
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - varbase-e2e's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium
  # Runtime-only prepare for the test jobs: vendor/, node_modules/, the docroot
  # and the browsers all arrive from the pull-only build cache, so this does NO
  # composer/yarn/playwright build - only the OS image libs, the Composer
  # autoloader dump and the Node runtime. Keeps the parallel test jobs fast.
  prepare_runtime_only: &prepare_runtime_only
    - apt-get update -y && apt-get install -y imagemagick webp libwebp7
    - apt-get install -y libmagickcore-7.q16-10-extra || apt-get install -y libmagickcore-6.q16-6-extra || true
    - sed -i 's/rights="none"\s*pattern="WEBP"/rights="read|write" pattern="WEBP"/I' /etc/ImageMagick-*/policy.xml 2>/dev/null || true
    - git config --global --add safe.directory '*'
    - chmod -R u+w $CI_PROJECT_DIR/$_WEB_ROOT/sites 2>/dev/null || true
    # Composer autoloader is a fast dump against the cached vendor/ (no resolve).
    - composer dump-autoload --optimize --no-interaction || true
    # Node runtime for cucumber-js (node_modules + browsers are cached).
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - node --version
    # System libs Chromium needs (the browser itself is cached).
    - ./node_modules/.bin/playwright install-deps chromium || true
  # Run one folder of Gherkin features (varbase-e2e) against the restored site.
  run_features: &run_features
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"

# = Install & prepare Varbase - single pre-test job =
#
# Builds the codebase, installs Varbase with the CLASSIC `varbase` profile (NO
# recipes), seeds the per-role testing users through drush (the 11.0.x method,
# mirroring the users registry in cucumber.js), prepares the site for
# deterministic testing (flood limits high, antibot /
# honeypot off, css/js preprocess off, verbose logging), and exports the
# installed site as small artifacts (gzipped DB dump + settings.php + files) for
# the test jobs.
"📦 Install Varbase":
  extends: .testing-job-base
  rules:
    - <<: *run_on_release_refs
    - changes: *varbase_app_changes
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  stage: pre-test
  needs: [composer]
  timeout: 2h
  # `drush site:install` runs the varbase_media_demo recipe's content import,
  # which validates its Vimeo oEmbed field by fetching the LIVE provider
  # registry (https://oembed.com/providers.json) and then the LIVE Vimeo
  # oEmbed API — two external network calls with no local fallback. A
  # transient failure to reach either ("No matching oEmbed provider found")
  # fails the whole install outright although the Vimeo URL itself is valid
  # (curl confirms https://vimeo.com/22439234 resolves fine). Retry the job
  # like cucumber.js already retries flaky scenario-level network timing
  # (retry: 1) — a REAL code/config regression fails identically on retry too,
  # so this only absorbs external unreliability, it never masks a real bug.
  retry: 2
  cache: *varbase_cache
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    # drupalci sets MYSQL_* only on its own test jobs; these custom jobs run a
    # hand-rolled DB service, so set them explicitly. The mariadb service image
    # creates this db+user at startup, and SIMPLETEST_DB below resolves to a db
    # the user owns (without these, MYSQL_DATABASE is empty and drush targets
    # the 'mysql' system schema -> "Access to system table ... is rejected").
    MYSQL_DATABASE: "mysql"
    MYSQL_USER: "drupaltestbot"
    MYSQL_PASSWORD: "drupaltestbotpw"
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - varbase-db.sql.gz
      - $_WEB_ROOT/sites/default/settings.php
      - $_WEB_ROOT/sites/default/files
    # Keep any screenshots/videos from the init feature run for debugging.
    reports: {}
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
  script:
    # Install Varbase (classic `varbase` profile) and provision the site for the
    # functional suites. All the site:install + drush/php:eval provisioning lives
    # in the versioned script (mirrors how 11.0.2 calls its recipes +
    # add-testing-users.sh); every step and its rationale is documented there.
    - bash $CI_PROJECT_DIR/tests/scripts/install-varbase-testing.sh
    # = Node.js 20 + Playwright Chromium (kept for parity of cached browsers) =
    - !reference [.fragments, node_playwright]
    # = Dump the prepared+seeded DB for the test jobs =
    - !reference [.fragments, dump_db]
  allow_failure: false

# = Storybook build - own job (pre-test) =
"📖 Storybook build":
  extends: .testing-job-base
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "docroot/modules/custom/**/*"
        - "docroot/themes/custom/**/*"
        - "docroot/recipes/custom/**/*"
        - "docroot/themes/**/*"
        - "**/*.stories.*"
        - ".storybook/**/*"
        - "package.json"
        - "yarn.lock"
        - "composer.lock"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  stage: pre-test
  needs:
    - composer
    - job: "📦 Install Varbase"
      artifacts: false
  timeout: 1h
  cache: *varbase_cache
  variables:
    STORYBOOK_SERVER_URL: "http://localhost"
    STORYBOOK_SERVER_RENDER_URL: "http://localhost/storybook/stories/render"
  artifacts:
    when: always
    paths:
      - storybook/
      - storybook-dev.log
    expire_in: 7 days
  before_script:
    - !reference [.fragments, prepare_code]
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    - corepack enable
    - yarn install --mode=skip-build
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - 'test -d $CI_PROJECT_DIR/$_WEB_ROOT/themes/contrib/vartheme_bs5/components || { echo "vartheme_bs5 components missing"; exit 1; }'
    - yarn storybook:build
    - 'test -f storybook/index.html || { echo "build produced no index.html"; exit 1; }'
    - 'test -f storybook/index.json || { echo "build produced no index.json"; exit 1; }'
    - |
      BUILD_COUNT=$(grep -o '"id":' storybook/index.json | wc -l)
      echo "Storybook build: ${BUILD_COUNT} entries in index.json"
      test "${BUILD_COUNT}" -gt 0 || { echo "0 stories in built index.json"; exit 1; }
    - yarn storybook:dev > storybook-dev.log 2>&1 &
    - SB_PID=$!
    - |
      UP=0
      for i in $(seq 1 60); do
        if curl -sf http://127.0.0.1:6006/index.json | grep -q '"entries"'; then UP=1; break; fi
        sleep 5
      done
      if [ "${UP}" != "1" ]; then echo "dev server did not come up on :6006"; tail -n 50 storybook-dev.log; kill "${SB_PID}" 2>/dev/null; exit 1; fi
    - |
      DEV_COUNT=$(curl -sf http://127.0.0.1:6006/index.json | grep -o '"id":' | wc -l)
      echo "Storybook dev: ${DEV_COUNT} entries served on :6006"
      test "${DEV_COUNT}" -gt 0 || { echo "dev server served 0 stories"; kill "${SB_PID}" 2>/dev/null; exit 1; }
    - |
      SB_URL=http://127.0.0.1:6006 node tests/storybook/check-storybook-page.mjs
      RC=$?
      kill "${SB_PID}" 2>/dev/null || true
      test "${RC}" -eq 0 || { echo "Storybook page check failed"; tail -n 50 storybook-dev.log; exit 1; }
  allow_failure: false

# = Automated Functional Acceptance Testing (varbase-e2e) - one parallel job per feature folder =
#
# Each job restores the installed+seeded site from the 📦 Install Varbase
# artifacts and runs ONE feature folder (SUITE) under tests/features/varbase/,
# writing its own JSON (CUCUMBER_JSON). The `parallel: matrix` fans the folders
# out into independent, parallel jobs; within a folder cucumber runs
# sequentially so setup -> consume scenarios keep their order. The matrix
# folders match the ACTUAL profile folder names.
"🧪 varbase-e2e":
  extends: .testing-job-base
  rules:
    - <<: *run_on_release_refs
    - changes: *varbase_app_changes
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible and can be
    # started on demand. allow_failure stays false so that when it IS run it
    # must pass.
    - when: manual
      allow_failure: false
  stage: test
  needs: [composer, "📦 Install Varbase"]
  timeout: 2h
  cache: *test_cache
  parallel:
    matrix:
      # The 5 original folders were split into 15 smaller topic folders
      # (matching the varbase_project 11.0.x layout style) so every matrix job
      # is naturally small enough to finish inside the runner's enforced job
      # time limit - a project/job `timeout` setting only raises GitLab's own
      # ceiling, it cannot override a shorter cap enforced by the runner
      # itself, and the old single 04-content-structure / 05-content-management
      # folders ran long enough to hit it. Only whole .feature files were
      # moved between folders (git mv, zero content changes); the one
      # in-folder dependency (05-00 seeds the entityqueue content that
      # 05-01..05-03 consume) is kept together in 13-entityqueue.
      - SUITE: "01-website-warmup-and-registration"
      - SUITE: "02-user-roles-and-formats"
      - SUITE: "03-languages-and-urls"
      - SUITE: "04-accessibility"
      - SUITE: "05-user-authentication"
      - SUITE: "06-user-protection"
      - SUITE: "07-admin-pages-and-navigation"
      - SUITE: "08-admin-users-and-media"
      - SUITE: "09-admin-preview-and-uploads"
      - SUITE: "10-basic-page-and-paragraphs"
      - SUITE: "11-paragraphs-and-blog"
      - SUITE: "12-layout-builder-and-homepage"
      - SUITE: "13-entityqueue"
      - SUITE: "14-cloning-media-and-linking"
      - SUITE: "15-workflow-and-trash"
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    # drupalci sets MYSQL_* only on its own test jobs; these custom jobs run a
    # hand-rolled DB service, so set them explicitly. The mariadb service image
    # creates this db+user at startup, and SIMPLETEST_DB below resolves to a db
    # the user owns (without these, MYSQL_DATABASE is empty and drush targets
    # the 'mysql' system schema -> "Access to system table ... is rejected").
    MYSQL_DATABASE: "mysql"
    MYSQL_USER: "drupaltestbot"
    MYSQL_PASSWORD: "drupaltestbotpw"
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    VARBASE_E2E_REPORT_DISABLE: "1"
    FEATURES: "tests/features/varbase/$SUITE/**/*.feature"
    CUCUMBER_JSON: "cucumber_report_$SUITE"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    # vendor/, node_modules/, the docroot (incl. files) and the browsers arrive
    # from the pull-only build cache - no composer/yarn/playwright build. Only
    # the OS image libs, Apache and the Node runtime are set up, then the DB
    # dump is restored (1s) and the suite runs.
    - !reference [.fragments, prepare_runtime_only]
    - !reference [.fragments, web_db]
    # = Restore the installed+seeded site =
    - gunzip -c $CI_PROJECT_DIR/varbase-db.sql.gz | $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:cli
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
  script:
    - !reference [.fragments, run_features]
  allow_failure: false

# = Create reports - own job (post-test) =
#
# Merges the per-folder cucumber JSONs from every Automated Functional Testing
# matrix job (plus their screenshots / videos) into one HTML + PDF report.
"📊 Create reports":
  stage: post-test
  image: node:22
  rules:
    # Auto-run in post-test whenever the test chain ran (release refs or the app
    # changed), even if a test failed, so the full report + status is always
    # published. Skipped only when no test ran (nothing to report).
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - changes: *varbase_app_changes
      when: always
    - when: never
  # DAG-schedule after the test matrix so the report is NOT held behind an
  # un-played blocking-manual validate job (stage ordering). Runs when the
  # whole varbase-e2e matrix passed.
  needs:
    - "🧪 varbase-e2e"
  dependencies:
    - "🧪 varbase-e2e"
  cache: *varbase_cache
  before_script:
    - apt-get update -y && apt-get install -y jq
    - npm install --no-save @vardot/varbase-e2e
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - jq -s 'add' tests/reports/cucumber_report_*.json > tests/reports/cucumber_report.json
    - export REPORT="varbase--${CI_COMMIT_REF_SLUG}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 30 days
  allow_failure: false
