################################################################################
# GitLab CI for the Varbase project template.
#
# Validation jobs (cspell / eslint / stylelint) plus a webship-js BDD
# browser-test job that builds Varbase, installs it with the `varbase`
# profile, applies the base recipes, seeds the per-role testing users and
# drives the whole site through the browser with webship-js (>= 2.0.4).
#
# This mirrors the Webshare pipeline (drupalci templates + a Node/Playwright
# browser job). Where Webshare tests a single module, this template builds
# and installs the full Varbase distribution before running the suite.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # Yarn 4 defaults to immutable installs and would refuse to create a
  # lockfile in CI; allow it for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# = Validate stage =
cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: false

# Node 20+ required: webship-js >= 2.0 declares engines.node ">=20".
eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = webship-js BDD - Varbase profile =
#
# Builds the project (drupalci's `composer` artefact), installs Varbase with
# the `varbase` profile, applies the base recipes, seeds the testing users
# and runs the full `tests/features/**` suite. cucumber.js auto-discovers the
# DDEV/LAUNCH_URL; in CI we pin LAUNCH_URL to the local Apache.
automated-functional-testing:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services - we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    WEBSHIP_REPORT_DISABLE: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  before_script:
    - !reference [.fragments, web_db]
    # = Install Varbase =
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install varbase
        --db-url=$SIMPLETEST_DB
        --account-name=webmaster --account-pass=dD.123123ddd --account-mail=webmaster@vardot.com
        --site-name="Varbase Test" --locale=en -y
    # = Base + AI recipes (mirrors ddev init-full-automated-testing) =
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_users_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_dev_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_i18n_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_api_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_auth_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_base -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_editor_assistant -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_image_alt -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_taxonomy_tagging -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_context -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/recipes/varbase_ai_safety -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:enable social_auth_facebook -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:enable social_auth_linkedin -y || true
    # = Seed the per-role testing users (registry mirrors cucumber.js users) =
    - cd $CI_PROJECT_DIR/recipes/varbase_starter/scripts && bash add-testing-users.sh && cd $CI_PROJECT_DIR
    # = Prepare site for deterministic testing =
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:uninstall antibot -y || true
    # Raise login flood ceilings + clear flood so the many test logins are not blocked.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood ip_limit 1000000 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood user_limit 1000000 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:query "TRUNCATE flood;" || true
    # Drop Honeypot's time trap (rejects scripted form posts) - keep field protection.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set honeypot.settings time_limit 0 -y || true
    # Disable the floating AI chatbot widget - it intercepts clicks near it.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '$b=\Drupal::entityTypeManager()->getStorage("block")->load("ai_chatbot"); if($b){$b->disable()->save();}' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance css.preprocess 0 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance js.preprocess 0 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.logging error_level all -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # = Node.js 20 + Playwright Chromium =
    - !reference [.fragments, node_playwright]
  script:
    # Disable webship-js's auto HTML hook (it cannot await PDF generation from
    # process.on('exit')) and run `generate-reports` explicitly after the run
    # so HTML + PDF land next to the JSON in tests/reports/.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false
