################################################################################
# GitLab CI for the Varbase 10.1.x project template.
#
# Keeps the drupalci PHPCS / PHPStan / composer-lint validation jobs disabled
# (they need the full composer build artifact, which is too large to publish),
# replaces them with self-contained emoji-named validate jobs (cspell / eslint /
# stylelint / phpcs / phpstan / yaml), and runs a pre-test -> test -> post-test
# browser flow that builds Varbase, installs it with the CLASSIC `varbase`
# profile (Varbase 10.1.x is NOT recipe-based), seeds the per-role testing
# users, prepares the site for deterministic testing, and drives the whole site
# through the browser with webship-js (Playwright + Cucumber-js).
#
# Varbase 10.1.x targets Drupal ~11.3/11.4; DRUPAL_CORE is pinned to 11.4.0 with
# IGNORE_PROJECT_DRUPAL_CORE_VERSION so the drupalci variables match the rest of
# the 10.1.x line.
#
# NOTE vs 11.0.x: there are NO `drush recipe ...` apply steps here (no
# varbase_dev_base / i18n / api / auth / ai / context / safety), and no AI /
# Canvas specific jobs — 10.1.x installs everything through the profile.
################################################################################

include:
  - local: '.gitlab-ci/php.yml'
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

# Pipeline stages. `build` / `validate` keep the (overridden) drupalci jobs; the
# Varbase browser flow runs as pre-test (install) -> test (run suite) ->
# post-test (build reports).
stages:
  - build
  - validate
  - pre-test
  - test
  - post-test

variables:
  # Pin Drupal core for the whole 10.1.x line (Drupal ~11.3/11.4).
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: 1
  # Yarn 4 defaults to immutable installs and would refuse to create a
  # lockfile in CI; allow it for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Cache locations (Composer packages, Yarn packages, Playwright browsers) so
  # the build / install / test jobs reuse downloads instead of re-fetching.
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/composer"
  YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/.cache/yarn"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"

# Shared cache definition referenced by the build / install / test jobs.
.varbase_cache: &varbase_cache
  key: "varbase-build"
  paths:
    - .cache/composer
    - .cache/yarn
    - .cache/ms-playwright

# Override composer job to build straight from this project's composer.json.
composer:
  cache: *varbase_cache
  before_script:
    - composer self-update
    - git config --global --add safe.directory '*'
  script:
    - composer validate --no-check-all --no-check-publish
    - composer update --with-all-dependencies --no-interaction --no-progress --optimize-autoloader --prefer-dist
  artifacts:
    expire_in: 1 day
    paths:
      - composer.json
      - composer.lock

# = Disable drupalci jobs that need the full composer build artifact =
#
# A full Varbase build is too large to publish as an artifact (413), so the
# composer job only passes composer.lock. drupalci's composer-lint / phpcs /
# phpstan expect the whole vendor/ + the composer status marker, so they cannot
# run here. We provide self-contained emoji-named replacements below.
composer-lint:
  rules: [{ when: never }]
  script: ["true"]
phpcs:
  rules: [{ when: never }]
  script: ["true"]
phpstan:
  rules: [{ when: never }]
  script: ["true"]
phpunit:
  rules: [{ when: never }]
  script: ["true"]
nightwatch:
  rules: [{ when: never }]
  script: ["true"]
"upgrade status":
  rules: [{ when: never }]
  script: ["true"]
"deprecation - composer":
  rules: [{ when: never }]
  script: ["true"]
cspell:
  rules: [{ when: never }]
  script: ["true"]
eslint:
  rules: [{ when: never }]
  script: ["true"]
stylelint:
  rules: [{ when: never }]
  script: ["true"]

# = Validate stage =

"🔤 Cspell":
  stage: validate
  image: node:20
  needs: []
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: false

# = YAML lint =
"📐 YAML lint":
  stage: validate
  image: python:3.12-slim
  needs: []
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python - <<'PY'
      import sys, yaml
      from pathlib import Path

      class Loader(yaml.SafeLoader):
          pass
      Loader.add_multi_constructor('', lambda loader, suffix, node: None)

      SKIP = ('vendor/', 'node_modules/', 'web/core/', 'web/modules/contrib/',
              'web/themes/contrib/', 'web/profiles/contrib/', 'web/libraries/',
              '.cache/')
      errors = 0
      count = 0
      for path in sorted(Path('.').rglob('*.y*ml')):
          rel = str(path).lstrip('./')
          if any(s in rel for s in SKIP):
              continue
          count += 1
          try:
              with open(path) as fh:
                  list(yaml.load_all(fh, Loader=Loader))
          except yaml.YAMLError as e:
              errors += 1
              print(f"INVALID: {rel}\n  {e}")
      print(f"Checked {count} YAML files, {errors} invalid.")
      sys.exit(1 if errors else 0)
      PY
  allow_failure: false

"🟨 ESLint":
  stage: validate
  image: node:20
  needs: []
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

"🎨 Stylelint":
  stage: validate
  image: node:20
  needs: []
  before_script:
    - corepack enable
    - yarn install --mode=skip-build
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: false

# = PHP_CodeSniffer (Drupal coding standards) =
"🐘 PHPCS":
  stage: validate
  image: php:8.4-cli
  needs: []
  before_script:
    - apt-get update -y && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer global require drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer --no-interaction
    - export PATH="$(composer global config bin-dir --absolute 2>/dev/null):$PATH"
  script:
    - mkdir -p web/modules/custom web/themes/custom
    - phpcs --version
    - phpcs --standard=.phpcs.xml -p web/modules/custom web/themes/custom
  allow_failure: false

# = PHPStan (static analysis) =
"🔬 PHPStan":
  stage: validate
  image: php:8.4-cli
  needs: []
  before_script:
    - apt-get update -y && apt-get install -y curl
    - curl -sSL https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -o phpstan.phar
    - chmod +x phpstan.phar
  script:
    - |
      if find web/modules/custom web/themes/custom -name '*.php' 2>/dev/null | grep -q .; then
        php phpstan.phar analyse -c phpstan.neon --no-progress
      else
        echo "No custom PHP files in PHPStan scope - nothing to analyse."
      fi
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  # Build the codebase in-job from the composer artifact's lock file and install
  # ImageMagick (Varbase's image toolkit) with WebP support.
  prepare_code: &prepare_code
    - apt-get update -y && apt-get install -y imagemagick webp libwebp7
    - apt-get install -y libmagickcore-7.q16-10-extra || apt-get install -y libmagickcore-6.q16-6-extra || true
    - sed -i 's/rights="none"\s*pattern="WEBP"/rights="read|write" pattern="WEBP"/I' /etc/ImageMagick-*/policy.xml 2>/dev/null || true
    - git config --global --add safe.directory '*'
    - chmod -R u+w $CI_PROJECT_DIR/$_WEB_ROOT/sites 2>/dev/null || true
    - composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - a2enmod rewrite headers
    - printf '<Directory /var/www/html>\n  Options +FollowSymLinks\n  AllowOverride All\n  Require all granted\n</Directory>\n' > /etc/apache2/conf-available/drupal-docroot.conf
    - a2enconf drupal-docroot
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  # Rebuild caches and dump the DB for the next pre-test job in the chain.
  dump_db: &dump_db
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:dump --gzip --result-file=$CI_PROJECT_DIR/varbase-db.sql
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium
  # Run one folder of Gherkin features (webship-js) against the restored site.
  run_features: &run_features
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"

# = Install & prepare Varbase - single pre-test job =
#
# Builds the codebase, installs Varbase with the CLASSIC `varbase` profile (NO
# recipes), seeds the per-role testing users by RUNNING the tools init features
# (tests/tools/step1-init-tests: create default testing users + add Arabic),
# prepares the site for deterministic testing (flood limits high, antibot /
# honeypot off, css/js preprocess off, verbose logging), and exports the
# installed site as small artifacts (gzipped DB dump + settings.php + files) for
# the test jobs.
"📦 Install Varbase":
  extends: .testing-job-base
  stage: pre-test
  needs: [composer]
  timeout: 2h
  cache: *varbase_cache
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - varbase-db.sql.gz
      - $_WEB_ROOT/sites/default/settings.php
      - $_WEB_ROOT/sites/default/files
    # Keep any screenshots/videos from the init feature run for debugging.
    reports: {}
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
  script:
    # = Install Varbase (classic profile install; NOT recipe-based) =
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install varbase
        --db-url=$SIMPLETEST_DB
        --account-name=webmaster --account-pass=dD.123123ddd --account-mail=webmaster@vardot.com
        --site-name="Varbase Test" --locale=en -y
    # = Prepare the site for deterministic testing (before the browser init) =
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:uninstall antibot -y || true
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood ip_limit 1000000 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set user.flood user_limit 1000000 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set honeypot.settings time_limit 0 -y || true
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance css.preprocess 0 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance js.preprocess 0 -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.logging error_level all -y
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # = Node.js 20 + Playwright Chromium =
    - !reference [.fragments, node_playwright]
    # = Seed the per-role testing users through the browser (step1-init-tests) =
    #   01-create-default-testing-users.feature  -> Normal user, Editor, Content
    #                                                admin, SEO admin, Site admin,
    #                                                Super admin.
    #   02-add-arabic.feature                     -> add the Arabic language.
    - WEBSHIP_REPORT_DISABLE=1 FEATURES="tests/tools/step1-init-tests/**/*.feature"
        ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    # = Dump the prepared+seeded DB for the test jobs =
    - !reference [.fragments, dump_db]
  allow_failure: false

# = Storybook build - own job (pre-test) =
"📖 Storybook build":
  extends: .testing-job-base
  stage: pre-test
  needs:
    - composer
    - job: "📦 Install Varbase"
      artifacts: false
  timeout: 1h
  cache: *varbase_cache
  variables:
    STORYBOOK_SERVER_URL: "http://localhost"
    STORYBOOK_SERVER_RENDER_URL: "http://localhost/storybook/stories/render"
  artifacts:
    when: always
    paths:
      - storybook/
      - storybook-dev.log
    expire_in: 7 days
  before_script:
    - !reference [.fragments, prepare_code]
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    - corepack enable
    - yarn install --mode=skip-build
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - 'test -d web/themes/contrib/vartheme_bs5/components || { echo "vartheme_bs5 components missing"; exit 1; }'
    - yarn storybook:build
    - 'test -f storybook/index.html || { echo "build produced no index.html"; exit 1; }'
    - 'test -f storybook/index.json || { echo "build produced no index.json"; exit 1; }'
    - |
      BUILD_COUNT=$(grep -o '"id":' storybook/index.json | wc -l)
      echo "Storybook build: ${BUILD_COUNT} entries in index.json"
      test "${BUILD_COUNT}" -gt 0 || { echo "0 stories in built index.json"; exit 1; }
    - yarn storybook:dev > storybook-dev.log 2>&1 &
    - SB_PID=$!
    - |
      UP=0
      for i in $(seq 1 60); do
        if curl -sf http://127.0.0.1:6006/index.json | grep -q '"entries"'; then UP=1; break; fi
        sleep 5
      done
      if [ "${UP}" != "1" ]; then echo "dev server did not come up on :6006"; tail -n 50 storybook-dev.log; kill "${SB_PID}" 2>/dev/null; exit 1; fi
    - |
      DEV_COUNT=$(curl -sf http://127.0.0.1:6006/index.json | grep -o '"id":' | wc -l)
      echo "Storybook dev: ${DEV_COUNT} entries served on :6006"
      test "${DEV_COUNT}" -gt 0 || { echo "dev server served 0 stories"; kill "${SB_PID}" 2>/dev/null; exit 1; }
    - |
      SB_URL=http://127.0.0.1:6006 node tests/storybook/check-storybook-page.mjs
      RC=$?
      kill "${SB_PID}" 2>/dev/null || true
      test "${RC}" -eq 0 || { echo "Storybook page check failed"; tail -n 50 storybook-dev.log; exit 1; }
  allow_failure: false

# = webship-js BDD - one parallel job per feature folder =
#
# Each job restores the installed+seeded site from the 📦 Install Varbase
# artifacts and runs ONE feature folder (SUITE) under tests/features/varbase/,
# writing its own JSON (CUCUMBER_JSON). The `parallel: matrix` fans the folders
# out into independent, parallel jobs; within a folder cucumber runs
# sequentially so setup -> consume scenarios keep their order. The matrix
# folders match the ACTUAL profile folder names.
"🧪 Automated Functional Testing":
  extends: .testing-job-base
  stage: test
  needs: [composer, "📦 Install Varbase"]
  timeout: 2h
  cache: *varbase_cache
  parallel:
    matrix:
      - SUITE:
          - "01-website-base-requirements"
          - "02-user-management"
          - "03-admin-management"
          - "04-content-structure"
          - "05-content-management"
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    WEBSHIP_REPORT_DISABLE: "1"
    FEATURES: "tests/features/varbase/$SUITE/**/*.feature"
    CUCUMBER_JSON: "cucumber_report_$SUITE"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
    # = Restore the installed+seeded site =
    - gunzip -c $CI_PROJECT_DIR/varbase-db.sql.gz | $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:cli
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    - !reference [.fragments, run_features]
  allow_failure: false

# = Cleanup - own job (post-test) =
#
# Restores the installed site and runs the tools/step3-cleanup-tests features
# (delete default testing users, delete Arabic, cleanup entityqueue testing
# content, cleanup leftover media). Best-effort: never blocks the reports.
"🧹 Cleanup after tests":
  extends: .testing-job-base
  stage: post-test
  needs:
    - composer
    - job: "📦 Install Varbase"
    - job: "🧪 Automated Functional Testing"
      artifacts: false
  timeout: 1h
  cache: *varbase_cache
  rules:
    - when: always
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    WEBSHIP_REPORT_DISABLE: "1"
    FEATURES: "tests/tools/step3-cleanup-tests/**/*.feature"
    CUCUMBER_JSON: "cucumber_report_cleanup"
  before_script:
    - !reference [.fragments, prepare_code]
    - !reference [.fragments, web_db]
    - gunzip -c $CI_PROJECT_DIR/varbase-db.sql.gz | $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT sql:cli
    - $CI_PROJECT_DIR/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip" || true
  allow_failure: true

# = Create reports - own job (post-test) =
#
# Merges the per-folder cucumber JSONs from every Automated Functional Testing
# matrix job (plus their screenshots / videos) into one HTML + PDF report.
"📊 Create reports":
  stage: post-test
  image: node:20
  rules:
    - when: always
  dependencies:
    - "🧪 Automated Functional Testing"
  cache: *varbase_cache
  before_script:
    - apt-get update -y && apt-get install -y jq
    - npm install --no-save webship-js
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - jq -s 'add' tests/reports/cucumber_report_*.json > tests/reports/cucumber_report.json
    - export REPORT="varbase--${CI_COMMIT_REF_SLUG}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 30 days
  allow_failure: false
