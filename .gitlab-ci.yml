# = Create reports - own job =
#
# Merges the per-folder cucumber JSONs from every Automated Functional Testing
# matrix job (plus their screenshots / videos) into one HTML + PDF report. Runs
# on a plain node image with webship-js + a Chromium for the PDF - no Drupal.
"📊 Create reports":
  stage: post-test
  image: node:22
  # Always build the reports, even when a test job failed - so failures are
  # captured. `dependencies` (not `needs`) pulls the artifacts from ALL matrix
  # jobs of the test stage without gating on their success.
  rules:
    - when: always
  dependencies:
    - "🧪 Automated Functional Testing"
  cache: *varbase_cache
  before_script:
    - apt-get update -y && apt-get install -y jq
    - npm install --no-save webship-js
    # --with-deps installs Chromium's system libraries (libnspr4 etc.) which the
    # plain node image lacks - needed for the PDF report's headless Chromium.
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    # Merge every folder's cucumber JSON array into one combined report.
    - jq -s 'add' tests/reports/cucumber_report_*.json > tests/reports/cucumber_report.json
    # Human-readable report name: varbase--{branch|tag}--automated-functional-testing-report--{date}--{time}
    - export REPORT="varbase--${CI_COMMIT_REF_SLUG}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 30 days
  allow_failure: false
